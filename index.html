<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; media-src 'self' blob:; form-action 'none'; base-uri 'none'">
<title>DRAKOS - Ζωντανή σάρωση QR</title>
<style>
*{box-sizing:border-box}body{background:#151b22;color:#f3f6f7;font:17px Arial,sans-serif;margin:auto;max-width:650px;padding:18px}h1{font-size:25px}small{color:#b9d9d1}video{width:100%;max-height:65vh;border:2px solid #218baa;border-radius:10px;background:#000;object-fit:cover}button{width:100%;padding:18px;margin:12px 0;border:0;border-radius:8px;background:#167b98;color:white;font-size:19px;font-weight:bold}button:disabled{opacity:.6}#status{background:#27343e;padding:12px;border-radius:7px;min-height:48px;white-space:pre-wrap}code{color:#aee7d0}label{display:block;margin:8px 0 5px}input{width:100%;padding:12px;font-size:17px;border-radius:7px}
</style>
</head><body>
<h1>DRAKOS — Ζωντανή σάρωση QR</h1>
<p><small>ΔΟΚΙΜΗ ΜΟΝΟ ΑΝΑΓΝΩΣΗΣ. Η εικόνα της κάμερας δεν αποστέλλεται σε server.</small></p>
<video id="camera" playsinline muted autoplay></video>
<button id="start">ΑΝΟΙΓΜΑ ΚΑΜΕΡΑΣ / ΣΑΡΩΣΗ</button>
<div id="status" role="status">Πάτησε το κουμπί για να ενεργοποιήσεις την κάμερα.</div>
<p><small>Μόλις αναγνωριστεί το QR, ανοίγει η δοκιμαστική αναζήτηση στον προσωπικό σου υπολογιστή.</small></p>
<label for="host">Διεύθυνση προσωπικού υπολογιστή</label>
<input id="host" value="192.168.1.78" inputmode="decimal" autocomplete="off" spellcheck="false">
<script>
'use strict';
let stream=null, scanBusy=false, finished=false, detector=null;
const video=document.getElementById('camera'), status=document.getElementById('status'), button=document.getElementById('start');
function text(v){status.textContent=v;}
function closeCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function decodeTarget(raw){
  const ip=document.getElementById('host').value.trim();
  if(!/^(?:\d{1,3}\.){3}\d{1,3}$/.test(ip)||ip.split('.').some(n=>Number(n)>255)){text('Μη έγκυρη IPv4 διεύθυνση.');return;}
  const first=raw.trim();
  if(!first){text('Το QR δεν περιέχει κωδικό.');return;}
  finished=true;closeCamera();text('QR αναγνωρίστηκε. Άνοιγμα αναζήτησης...');
  window.location.assign('http://'+ip+':50890/qr-results?code='+encodeURIComponent(first));
}
async function scanLoop(){
 if(finished||!stream)return;
 if(video.readyState>=2&&!scanBusy){
  scanBusy=true;
  try{const found=await detector.detect(video);if(found.length&&found[0].rawValue){decodeTarget(found[0].rawValue);return;}}
  catch(e){text('Σφάλμα ανάγνωσης QR: '+e.message);closeCamera();button.disabled=false;return;}
  finally{scanBusy=false;}
 }
 setTimeout(scanLoop,130);
}
button.addEventListener('click',async()=>{
 button.disabled=true;finished=false;
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){text('Η ζωντανή κάμερα χρειάζεται HTTPS. Η σελίδα πρέπει να δημοσιευτεί με HTTPS.');button.disabled=false;return;}
 if(!('BarcodeDetector' in window)){text('Το πρόγραμμα περιήγησης δεν υποστηρίζει BarcodeDetector. Δοκίμασε ενημερωμένο Chrome στο Android.');button.disabled=false;return;}
 try{
   if(BarcodeDetector.getSupportedFormats){const formats=await BarcodeDetector.getSupportedFormats();if(!formats.includes('qr_code'))throw new Error('Αυτή η έκδοση Chrome δεν υποστηρίζει QR.');}
   detector=new BarcodeDetector({formats:['qr_code']});
   stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
   video.srcObject=stream; await video.play();text('Στρέψε την κάμερα προς το QR.');scanLoop();
 }catch(e){closeCamera();text('Δεν άνοιξε η κάμερα: '+e.message);button.disabled=false;}
});
window.addEventListener('pagehide',closeCamera);
</script>
</body></html>
